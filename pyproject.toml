[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-water"
version = "0.1.0"
description = "Small SAR surface-water mapping experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
audit = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
sar-water-audit = "sar_water.data:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
